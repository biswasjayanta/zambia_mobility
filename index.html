const basemap=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{

}).addTo(map);
basemap.on('tileerror',()=>{
 document.getElementById('basemap-warning').style.display='block';
});

const provinceLayer=L.layerGroup().addTo(map);
for(const ring of GEO){
 L.polygon(ring.map(([lon,lat])=>[lat,lon]),{
  color:'#64748B',weight:0.8,fillColor:'#FFFFFF',fillOpacity:0.12,interactive:false
 }).addTo(provinceLayer);
}
const flowLayer=L.layerGroup().addTo(map);

function color(t){const c=[[13,8,135],[126,3,168],[204,71,120],[248,149,64],[240,249,33]];
 t=Math.min(.999,Math.max(0,t));const x=t*(c.length-1),i=x|0,f=x-i,a=c[i],b=c[i+1];
 return `rgb(${a[0]+(b[0]-a[0])*f|0},${a[1]+(b[1]-a[1])*f|0},${a[2]+(b[2]-a[2])*f|0})`;}

function draw(){
 flowLayer.clearLayers();
 const mi=MI[metric];
 let rows=DATA.filter(d=>region==='all'?true:region==='local'?d[7]===1:d[7]===0);
 rows.sort((a,b)=>b[mi]-a[mi]); rows=rows.slice(0,N);
 const vmax=rows.length?rows[0][mi]:1, vmin=rows.length?rows[rows.length-1][mi]:1;

 for(let i=rows.length-1;i>=0;i--){const d=rows[i],v=d[mi];

  L.polyline([[d[1],d[0]],[d[3],d[2]]],{

  }).addTo(flowLayer);

  `${rows.length} edges · ${metric} · max ${Math.round(vmax).toLocaleString()} movers/yr`;
}
function sel(q,b){document.querySelectorAll(q).forEach(x=>x.classList.remove('on'));b.classList.add('on');}

document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{N=+b.dataset.n;sel('[data-n]',b);draw();});
document.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{region=b.dataset.region;sel('[data-region]',b);draw();});
